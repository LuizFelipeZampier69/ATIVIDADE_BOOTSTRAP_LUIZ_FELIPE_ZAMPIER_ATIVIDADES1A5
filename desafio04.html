<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 04 - Inscrição de Equipe</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        /* Força os campos de input e select a terem texto branco e fundo preto */
        .form-control, .form-select {
            background-color: #000000 !important;
            color: #ffffff !important;
            border-color: #ffc107 !important;
        }
        /* Deixa o texto cinza claro quando o usuário digita ou no placeholder */
        .form-control::placeholder {
            color: #aaaaaa !important;
            opacity: 1;
        }
        .form-control:focus, .form-select:focus {
            background-color: #000000 !important;
            color: #ffffff !important;
            box-shadow: 0 0 0 0.25rem rgba(255, 193, 7, 0.25);
            border-color: #ffc107 !important;
        }
    </style>
</head>
<body class="bg-black text-white">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-warning">
        <div class="container">
            <a href="index.html" class="navbar-brand fw-bold text-warning">Meu Portfólio</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a href="index.html" class="nav-link text-white">Início</a></li>
                    <li class="nav-item"><a href="desafio01.html" class="nav-link text-white">Desafio 01</a></li>
                    <li class="nav-item"><a href="desafio02.html" class="nav-link text-white">Desafio 02</a></li>
                    <li class="nav-item"><a href="desafio03.html" class="nav-link text-white">Desafio 03</a></li>
                    <li class="nav-item"><a href="desafio04.html" class="nav-link active text-warning">Desafio 04</a></li>
                    <li class="nav-item"><a href="desafio05.html" class="nav-link text-white">Desafio 05</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-8">
                <div class="card shadow-lg bg-dark text-white p-4 border border-warning">
                    <h3 class="mb-4 text-warning fw-bold">Inscrição de Equipe - Torneio de Futebol</h3>
                    <form>
                        <div class="row g-3">
                            <div class="col-sm-6">
                                <label class="form-label text-warning">Nome do Responsável</label>
                                <input type="text" class="form-control" placeholder="Seu nome" required>
                            </div>
                            <div class="col-sm-6">
                                <label class="form-label text-warning">Nome da Equipe / Time</label>
                                <input type="text" class="form-control" placeholder="Nome do time" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label text-warning">Telefone / WhatsApp</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-warning text-black fw-bold border-warning">(41)</span>
                                    <input type="tel" class="form-control" placeholder="99999-9999" required>
                                </div>
                            </div>
                            <div class="col-12">
                                <label class="form-label text-warning">Categoria do Torneio</label>
                                <select class="form-select" required>
                                    <option selected disabled value="">Escolha uma categoria</option>
                                    <option value="1" class="bg-black text-white">Futebol de Campo</option>
                                    <option value="2" class="bg-black text-white">Futsal / Society</option>
                                    <option value="3" class="bg-black text-white">Veteranos</option>
                                    <option value="4" class="bg-black text-white">Sub-20</option>
                                </select>
                            </div>
                            <div class="col-12">
                                <label class="form-label text-warning">Observações / Jogadores</label>
                                <textarea class="form-control" rows="4" placeholder="Informe detalhes adicionais ou lista prévia"></textarea>
                            </div>
                            <div class="col-12">
                                <div class="form-check">
                                    <input type="checkbox" class="form-check-input border-warning bg-black" id="termos" required>
                                    <label for="termos" class="form-check-label text-light">
                                        Confirmo que as informações do time estão corretas.
                                    </label>
                                </div>
                            </div>
                            <div class="col-12 mt-4">
                                <button class="btn btn-warning w-100 fw-bold text-black" type="submit">Enviar Inscrição</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
